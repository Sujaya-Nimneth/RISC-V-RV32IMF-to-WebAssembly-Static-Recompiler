[workspace]
resolver = "2"
members = [
    "crates/rv-abi",
    "crates/rv-decode",
    "crates/rv-ir",
    "crates/rv-wasm",
    "crates/rv-interp",
    "crates/rv-web-bridge",
    "crates/recomp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf"] }
wasm-encoder = "0.263.0"
wasmparser = "0.263.0"
wasmprinter = "0.263.0"
wasm-bindgen = "0.2.130"
wasmtime = "51.0.0"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
proptest = "1"

rv-abi = { path = "crates/rv-abi" }
rv-decode = { path = "crates/rv-decode" }
rv-ir = { path = "crates/rv-ir" }
rv-wasm = { path = "crates/rv-wasm" }
rv-interp = { path = "crates/rv-interp" }
